apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: public-speaking-coach-agent
  version: 1.0.0

type: agent

provides:
  apis:
    - name: public-speaking-coach-agent
      kind: a2a
      ordId: customer.build:apiResource:public-speaking-coach-2f288.public-speaking-coach-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
